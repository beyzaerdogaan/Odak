# Generate the Xcode project with:  xcodegen generate
# For the build with Screen Time app blocking (needs Apple's Family Controls approval):
#   xcodegen generate --spec project-screentime.yml
name: Odak
options:
  bundleIdPrefix: com.beyzaerdogan
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: tr
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Odak.xcconfig
  Release: Config/Odak.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
settingGroups:
  derin:
    base:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(ODAK_SCREEN_TIME_FLAG_$(ODAK_SCREEN_TIME))"
      # XcodeGen's iOS preset sets "1,2" on every target, which overrides the project-level value
      # and makes App Store Connect reject the portrait-only app as an iPad app.
      TARGETED_DEVICE_FAMILY: "1"
packages:
  OdakCore:
    path: Packages/OdakCore
  # Accounts: Firebase Auth (Sign in with Apple, Google) and Firestore for the sky's copy in the cloud.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
targets:
  Odak:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: LiveActivity
      - path: Music
      # Texts in Turkish (the base language) and English, shared with the extensions.
      - path: Localization
    dependencies:
      - package: OdakCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
      - target: DerinWidgets
      - target: DerinShare
    settings:
      groups: [derin]
      base:
        PRODUCT_NAME: Derin
        PRODUCT_MODULE_NAME: Odak
        PRODUCT_BUNDLE_IDENTIFIER: $(ODAK_BUNDLE_ID_PREFIX).derin
        CODE_SIGN_ENTITLEMENTS: App/Support/Odak-$(ODAK_SCREEN_TIME).entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconDawn
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    scheme:
      testTargets: []
      storeKitConfiguration: Config/Derin.storekit
  # Live Activity for a running focus: lock screen and Dynamic Island.
  DerinWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: LiveActivity
      - path: Localization
    settings:
      groups: [derin]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ODAK_BUNDLE_ID_PREFIX).derin.live-activity
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  # "Derin" in the share sheet of Spotify, Apple Music and YouTube Music: adds the shared list.
  DerinShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Music
      - path: Localization
    settings:
      groups: [derin]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ODAK_BUNDLE_ID_PREFIX).derin.share
        CODE_SIGN_ENTITLEMENTS: ShareExtension/Share.entitlements
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
