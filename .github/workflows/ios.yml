name: iOS build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Rules tests (OdakCore)
        run: swift test --package-path Packages/OdakCore

      - name: Build app
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build -project Odak.xcodeproj -scheme Odak \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Build app with Screen Time extensions
        run: |
          set -o pipefail
          xcodegen generate --spec project-screentime.yml
          xcodebuild build -project Odak.xcodeproj -scheme Odak \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO -quiet
