name: TestFlight

# Archives the app, signs it with a short-lived distribution certificate created through the
# App Store Connect API (revoked again at the end), and uploads it to TestFlight. No Mac needed.
# Needs the secrets APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (and GOOGLE_SERVICE_INFO_PLIST for accounts); see ci/asc_signing.py for why signing is done by hand.
on:
  workflow_dispatch:
    inputs:
      screen_time:
        description: "Screen Time (FamilyControls) ile derle. Yalnızca Apple onayı geldikten sonra."
        type: boolean
        default: false
  push:
    tags: ["v*"]

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_PREFIX: ${{ vars.BUNDLE_ID_PREFIX || 'com.beyzaerdogan' }}
      SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
      SCREEN_TIME: ${{ inputs.screen_time && 'YES' || vars.SCREEN_TIME || 'NO' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Eksik GitHub secret:$missing"; exit 1
          fi

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Firebase config (accounts)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST secret yok: bu sürümde hesaplar kapalı olur"
            exit 0
          fi
          P=App/Support/GoogleService-Info.plist
          # The secret can be the plist itself or its base64.
          if printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | grep -q '<plist'; then
            printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST" > "$P"
          else
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$P"
          fi
          plutil -lint "$P"
          BID=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" "$P")
          if [ "$BID" != "$BUNDLE_PREFIX.derin" ]; then
            echo "::error::GoogleService-Info.plist $BID için, uygulama $BUNDLE_PREFIX.derin"; exit 1
          fi
          REV=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$P" 2>/dev/null || true)
          if [ -z "$REV" ]; then
            echo "::warning::Plist'te REVERSED_CLIENT_ID yok: Firebase'de Google girişini açıp plist'i yeniden indir"
          else
            echo "GOOGLE_REVERSED_CLIENT_ID=$REV" >> "$GITHUB_ENV"
          fi

      - name: Generate project
        run: |
          if [ "$SCREEN_TIME" = "YES" ]; then xcodegen generate --spec project-screentime.yml; else xcodegen generate; fi

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          EXTRA=()
          if [ -n "${GOOGLE_REVERSED_CLIENT_ID:-}" ]; then EXTRA+=(ODAK_GOOGLE_REVERSED_CLIENT_ID="$GOOGLE_REVERSED_CLIENT_ID"); fi
          xcodebuild archive -project Odak.xcodeproj -scheme Odak -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Derin.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" ODAK_BUNDLE_ID_PREFIX="$BUNDLE_PREFIX" \
            ODAK_SPOTIFY_CLIENT_ID="$SPOTIFY_CLIENT_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO -quiet "${EXTRA[@]}"

      - name: Distribution certificate and profiles
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          IDS="$BUNDLE_PREFIX.derin+APPLE_ID_AUTH $BUNDLE_PREFIX.derin.live-activity"
          if [ "$SCREEN_TIME" = "YES" ]; then
            for ext in activity-monitor shield-configuration shield-action; do IDS="$IDS $BUNDLE_PREFIX.derin.$ext"; done
          fi
          S="$RUNNER_TEMP/signing"
          "$RUNNER_TEMP/venv/bin/python" ci/asc_signing.py setup "$S" $IDS

          /usr/bin/openssl x509 -inform DER -in "$S/cert.cer" -out "$S/cert.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$S/key.pem" -in "$S/cert.pem" -out "$S/ci.p12" -passout pass:ci
          KC="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$S/ci.p12" -k "$KC" -P ci -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          SHA1=$(/usr/bin/openssl x509 -in "$S/cert.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)
          echo "SIGN_IDENTITY=$SHA1" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Sign
        run: ci/sign_app.sh "$RUNNER_TEMP/Derin.xcarchive/Products/Applications/Derin.app" "$RUNNER_TEMP/signing" "$RUNNER_TEMP/Derin.ipa"

      - name: Upload to TestFlight
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/
          xcrun altool --upload-app -f "$RUNNER_TEMP/Derin.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Revoke CI certificate
        if: always()
        run: |
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$SIGN_KEYCHAIN" || true; fi
          if [ -x "$RUNNER_TEMP/venv/bin/python" ]; then
            "$RUNNER_TEMP/venv/bin/python" ci/asc_signing.py cleanup "$RUNNER_TEMP/signing"
          fi

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing" ~/.appstoreconnect/private_keys
