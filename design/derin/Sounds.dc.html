<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Ses ve müzik</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#090D22}
.scr{--night:#090D22;--night-2:#0E1430;--plate:rgba(236,230,214,.045);--plate-2:rgba(236,230,214,.08);
  --hair:rgba(236,230,214,.11);--paper:#ECE6D6;--paper-2:#A7ADC6;--paper-3:#6E7597;
  --nebula:#E6A6C7;--ice:#A8C4FF;--aurora:#8FDCC0;--meteor:#C9B8FF;--ember:#F0A070;--alarm:#F2A49A;
  position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:var(--night);
  color:var(--paper);font:400 15px/1.4 'Hanken Grotesk',sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column}
.scr *{box-sizing:border-box}
:where(.scr) a{color:inherit;text-decoration:none}
:where(.scr) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.scr :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.sky{position:absolute;inset:0;pointer-events:none}
.layer{position:relative;display:flex;flex-direction:column;flex:1;min-height:0}
.layer>*{flex-shrink:0}
.serif{font-family:'Newsreader',serif;font-optical-sizing:auto;font-weight:400;letter-spacing:-.01em}
.it{font-style:italic}
.h1{margin:0;font-family:'Newsreader',serif;font-weight:400;font-size:36px;line-height:1.05;letter-spacing:-.02em}
.h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.005em}
.meta{margin:0;font-size:13px;color:var(--paper-2)}
.small{font-size:12px;color:var(--paper-3)}
.num{font-variant-numeric:tabular-nums lining-nums}
.acc{color:var(--accent)}
.fa{fill:var(--accent)}
.sa{stroke:var(--accent)}
.rule{height:1px;background:var(--hair);border:0;margin:0}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.btn{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:10px;
  font:600 16px 'Hanken Grotesk',sans-serif;letter-spacing:-.005em}
.btn-acc{background:var(--accent);color:#1C1404;box-shadow:0 10px 30px -12px var(--accent)}
.btn-ghost{height:50px;border:1px solid var(--hair);color:var(--paper);font-weight:500;font-size:15px}
.seg{display:grid;gap:2px;padding:3px;border-radius:999px;background:var(--plate)}
.seg>*{min-height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:14px;
  font-weight:500;color:var(--paper-2)}
.seg>[aria-pressed=true],.seg>[aria-checked=true],.seg>[aria-selected=true]{background:var(--paper);color:#0B1026;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:13px;
  color:var(--paper);background:var(--plate)}
.tog{flex:none;width:51px;height:31px;border-radius:999px;background:rgba(236,230,214,.16);padding:2px;display:flex}
.tog::after{content:"";width:27px;height:27px;border-radius:50%;background:#FFF;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.tog[aria-pressed=true]{background:var(--accent);justify-content:flex-end}
.list>*{border-bottom:1px solid var(--hair)}
.list>*:last-child{border-bottom:0}
.bar{height:4px;border-radius:999px;background:var(--plate-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.price{flex:none;display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 13px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent);font-size:14px;font-weight:600}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;padding:8px 24px 0;display:flex;justify-content:space-around;
  align-items:flex-start;background:linear-gradient(to top,rgba(9,13,34,.98) 55%,rgba(9,13,34,0));}
.tabbar a{min-width:72px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;
  font-weight:500;color:var(--paper-3)}
.tabbar a[aria-current=page]{color:var(--accent)}
.iconbtn{flex:none;width:44px;height:44px;border-radius:50%;background:var(--plate);display:flex;align-items:center;justify-content:center}
@keyframes ignite{0%{transform:scale(.2) rotate(-30deg);opacity:0}60%{transform:scale(1.12) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes halo{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
.ignite{transform-origin:center;transform-box:fill-box;animation:ignite 1.1s cubic-bezier(.2,.8,.2,1) both .2s}
.halo{transform-origin:center;transform-box:fill-box;animation:halo 1.6s ease-out both}
@media (prefers-reduced-motion:reduce){.ignite,.halo{animation:none}}

body{background:#05081A}
</style>
</helmet>
<div class="scr " style="--accent: {{accent}}; background:#05081A">
<div aria-hidden="true" style="position:absolute;inset:0;background:#05081A"></div>
<div aria-hidden="true" style="position:absolute;left:14px;right:14px;top:16px;height:40px;border-radius:24px 24px 0 0;background:#0C1129;opacity:.7"></div>
<div class="layer" style="margin-top:30px;border-radius:30px 30px 0 0;background:#0E1430;padding:10px 22px 24px;gap:24px;box-shadow:0 -20px 60px rgba(0,0,0,.5)">
  <span aria-hidden="true" style="align-self:center;width:38px;height:5px;border-radius:999px;background:rgba(236,230,214,.2)"></span>
  <header class="between" style="align-items:center">
    <h1 class="h1" style="font-size:30px">Ses ve müzik</h1>
    <a href="Active.dc.html" aria-label="Kapat" class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A7ADC6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
  </header>

  <section aria-labelledby="ortam" style="display:flex;flex-direction:column;gap:12px">
    <div class="between"><h2 id="ortam" class="h2">Ortam sesleri</h2><span class="small">2 sese kadar karıştır</span></div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 6px"><button aria-pressed="true" style="display:flex;flex-direction:column;align-items:center;gap:7px;min-height:88px;font-size:12px;line-height:1.2;color:var(--paper);text-align:center"><span style="width:56px;height:56px;border-radius:50%;background:rgba(143,220,192,.16);box-shadow:inset 0 0 0 1.5px var(--aurora);display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8FDCC0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 13.5h10a3.5 3.5 0 0 0 .4-7A5 5 0 0 0 7.5 6.5 3.5 3.5 0 0 0 7 13.5z"/><path d="M8.5 16.5l-1 3M12.5 16.5l-1 3M16.5 16.5l-1 3"/></svg></span>Yağmur</button><button aria-pressed="false" style="display:flex;flex-direction:column;align-items:center;gap:7px;min-height:88px;font-size:12px;line-height:1.2;color:var(--paper);text-align:center"><span style="width:56px;height:56px;border-radius:50%;background:var(--plate);display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A7ADC6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l6 9h-4l4 6H6l4-6H6z"/><path d="M12 18v3"/></svg></span>Orman</button><button aria-pressed="false" style="display:flex;flex-direction:column;align-items:center;gap:7px;min-height:88px;font-size:12px;line-height:1.2;color:var(--paper);text-align:center"><span style="width:56px;height:56px;border-radius:50%;background:var(--plate);display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A7ADC6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12c2-2 4-2 6 0s4 2 6 0 4-2 6 0M2 17c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg></span>Dalga</button><button aria-pressed="false" style="display:flex;flex-direction:column;align-items:center;gap:7px;min-height:88px;font-size:12px;line-height:1.2;color:var(--paper);text-align:center"><span style="width:56px;height:56px;border-radius:50%;background:var(--plate);display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A7ADC6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3 4 5 6 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3 0-6 1-9z"/></svg></span>Şömine</button><button aria-pressed="false" style="display:flex;flex-direction:column;align-items:center;gap:7px;min-height:88px;font-size:12px;line-height:1.2;color:var(--paper);text-align:center"><span style="width:56px;height:56px;border-radius:50%;background:var(--plate);display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A7ADC6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2"/></svg></span>Kahverengi gürültü</button><button aria-pressed="false" style="display:flex;flex-direction:column;align-items:center;gap:7px;min-height:88px;font-size:12px;line-height:1.2;color:var(--paper);text-align:center"><span style="width:56px;height:56px;border-radius:50%;background:rgba(168,196,255,.10);display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8C4FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M4 6.5l16 11M20 6.5l-16 11"/></svg></span>Kış gecesi</button><button aria-disabled="true" style="display:flex;flex-direction:column;align-items:center;gap:7px;min-height:88px;font-size:12px;line-height:1.2;color:var(--paper-3);text-align:center"><span style="width:56px;height:56px;border-radius:50%;border:1px dashed rgba(236,230,214,.22);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E7597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg></span>Kütüphane</button><button aria-disabled="true" style="display:flex;flex-direction:column;align-items:center;gap:7px;min-height:88px;font-size:12px;line-height:1.2;color:var(--paper-3);text-align:center"><span style="width:56px;height:56px;border-radius:50%;border:1px dashed rgba(236,230,214,.22);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E7597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg></span>Kahvehane</button></div>
    <div class="row" style="gap:14px">
      <label for="vol" style="font-size:13px;color:var(--paper-2);min-width:56px">Yağmur</label>
      <div style="flex:1;position:relative;height:28px;display:flex;align-items:center">
        <div class="bar" style="flex:1;height:6px"><i style="width:30%;background:var(--aurora)"></i></div>
        <span aria-hidden="true" style="position:absolute;left:calc(30% - 12px);width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)"></span>
        <input id="vol" type="range" min="0" max="100" value="30" style="position:absolute;inset:0;opacity:0;width:100%">
      </div>
      <span class="num" style="font-size:13px;color:var(--paper-2);min-width:32px;text-align:right">%30</span>
    </div>
  </section>

  <hr class="rule">

  <section aria-labelledby="spot" style="display:flex;flex-direction:column;gap:4px">
    <div class="between" style="align-items:center">
      <div>
        <h2 id="spot" class="h2">Spotify</h2>
        <p class="row" style="margin:2px 0 0;gap:6px;font-size:12px;color:var(--aurora)"><span style="width:6px;height:6px;border-radius:50%;background:var(--aurora)"></span>Hesabın bağlı, odak boyunca engellenmez</p>
      </div>
      <a href="#" style="min-height:44px;display:flex;align-items:center;font-size:13px;color:var(--paper-2)">Bağlantıyı kes</a>
    </div>
    <div class="list"><button aria-pressed="true" class="row" style="min-height:62px;padding:8px 4px;text-align:left;width:100%"><span aria-hidden="true" style="flex:none;width:44px;height:44px;border-radius:8px;background:linear-gradient(140deg,#2A6A6A,#13233A)"></span><span style="flex:1;min-width:0"><span style="display:block;font-size:15px;font-weight:600;color:#8FDCC0">Derin Odak</span><span class="small" style="display:block">Önerilen, enstrümantal</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="#8FDCC0" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg></button><button aria-pressed="false" class="row" style="min-height:62px;padding:8px 4px;text-align:left;width:100%"><span aria-hidden="true" style="flex:none;width:44px;height:44px;border-radius:8px;background:linear-gradient(140deg,#5A3E7A,#221A3A)"></span><span style="flex:1;min-width:0"><span style="display:block;font-size:15px;font-weight:600;">Lo-fi Çalışma</span><span class="small" style="display:block">Önerilen</span></span></button><button aria-pressed="false" class="row" style="min-height:62px;padding:8px 4px;text-align:left;width:100%"><span aria-hidden="true" style="flex:none;width:44px;height:44px;border-radius:8px;background:linear-gradient(140deg,#7A5A2A,#2A1E10)"></span><span style="flex:1;min-width:0"><span style="display:block;font-size:15px;font-weight:600;">[KULLANICININ LİSTESİ]</span><span class="small" style="display:block">Senin çalma listelerin</span></span></button></div>
  </section>

  <div class="row" style="margin-top:auto;justify-content:space-between;min-height:64px;padding:8px 16px;border-radius:20px;background:var(--plate)">
    <div><p style="margin:0;font-size:15px;font-weight:500">Bitince müziği durdur</p><p class="small" style="margin:2px 0 0">Molada ses yumuşakça azalır</p></div>
    <button class="tog" aria-label="Bitince müziği durdur" aria-pressed="true"></button>
  </div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2C46D","options":["#F2C46D","#8FB3FF","#7FD6B5"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F2C46D' };
  }
}
</script>
</body>
</html>
