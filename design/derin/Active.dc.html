<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Odak sürüyor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#080B16}
a{color:#F2C46D}a:hover{color:#FFD98F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #080B16; color: #EEF0F7; font-family: 'DM Sans', sans-serif; padding: 60px 24px 24px; display: flex; flex-direction: column; align-items: center; gap: 20px; overflow: hidden; position: relative">
  <span aria-hidden="true" style="position: absolute; left: 40px; top: 120px; width: 2px; height: 2px; border-radius: 50%; background: #9AA1B9"></span>
  <span aria-hidden="true" style="position: absolute; left: 330px; top: 90px; width: 3px; height: 3px; border-radius: 50%; background: #C9CEDD"></span>
  <span aria-hidden="true" style="position: absolute; left: 300px; top: 210px; width: 2px; height: 2px; border-radius: 50%; background: #9AA1B9"></span>
  <span aria-hidden="true" style="position: absolute; left: 70px; top: 300px; width: 3px; height: 3px; border-radius: 50%; background: #6E7590"></span>

  <header style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
    <p style="margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #9AA1B9">Derin odak</p>
    <h1 style="margin: 0; font-size: 19px; font-weight: 500">Tez · Bölüm 3 literatür</h1>
  </header>

  <a href="Reward.dc.html" aria-label="Oturumu tamamla (prototip)" style="position: relative; width: 250px; height: 250px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #EEF0F7">
    <svg width="250" height="250" viewBox="0 0 250 250" aria-hidden="true" style="position: absolute; inset: 0">
      <circle cx="125" cy="125" r="114" fill="none" stroke="#1C2236" stroke-width="6"></circle>
      <circle cx="125" cy="125" r="114" fill="none" stroke="{{accent}}" stroke-width="6" stroke-linecap="round" stroke-dasharray="716" stroke-dashoffset="208" transform="rotate(-90 125 125)"></circle>
    </svg>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
      <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true" style="opacity: 0.72"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z" fill="{{accent}}"></path></svg>
      <p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums">32:14</p>
      <p style="margin: 0; font-size: 14px; color: #9AA1B9">Hangi yıldız? Bitince göreceksin</p>
    </div>
  </a>

  <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center">
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 8px 12px; border-radius: 999px; background: #121729; border: 1px solid #262C44">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C9CEDD" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      7 uygulama kilitli
    </span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 8px 12px; border-radius: 999px; background: #121729; border: 1px solid #262C44">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C9CEDD" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      Bildirimler susturuldu
    </span>
  </div>

  <div style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="background: #121729; border: 1px solid #262C44; border-radius: 16px; padding: 12px 14px">
      <p style="margin: 0; font-size: 12px; color: #9AA1B9">Telefona bakmadan</p>
      <p style="margin: 4px 0 0; font-size: 19px; font-weight: 700">12:46 dk</p>
    </div>
    <div style="background: #121729; border: 1px solid #262C44; border-radius: 16px; padding: 12px 14px">
      <p style="margin: 0; font-size: 12px; color: #9AA1B9">Biriken Işık</p>
      <p style="margin: 4px 0 0; font-size: 19px; font-weight: 700; color: {{accent}}">+15</p>
    </div>
  </div>

  <section aria-label="Çalan ses" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 12px; background: #121729; border: 1px solid #262C44; border-radius: 16px; padding: 8px 8px 8px 12px">
    <span style="flex: none; width: 40px; height: 40px; border-radius: 10px; background: #1B2235; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7FD6B5" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg>
    </span>
    <a href="Sounds.dc.html" style="flex: 1; min-width: 0; min-height: 44px; display: flex; flex-direction: column; justify-content: center; text-decoration: none; color: #EEF0F7">
      <span style="font-size: 14px; font-weight: 700">Derin Odak listesi</span>
      <span style="font-size: 12px; color: #9AA1B9">Spotify · + Yağmur sesi %30</span>
    </a>
    <button aria-label="Duraklat" style="flex: none; width: 44px; height: 44px; border-radius: 12px; border: 0; background: #262C44; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#EEF0F7" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
    </button>
  </section>

  <div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center">
    <button style="width: 100%; height: 50px; border-radius: 16px; border: 1px solid #262C44; background: transparent; color: #EEF0F7; font: 500 15px 'DM Sans', sans-serif">5 dk mola · 1 hakkın var</button>
    <button style="width: 100%; height: 50px; border-radius: 16px; border: 1px solid #5A2E34; background: #1E1216; color: #FFB4B4; font: 500 15px 'DM Sans', sans-serif">Vazgeçmek için basılı tut</button>
    <p style="margin: 0; font-size: 12px; color: #9AA1B9; text-align: center">Vazgeçersen yıldız söner, ama odakladığın dakikalar sayılır.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2C46D","options":["#F2C46D","#8FB3FF","#7FD6B5"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F2C46D' };
  }
}
</script>
</body>
</html>
