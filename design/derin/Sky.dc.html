<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Gökyüzüm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1220}
a{color:#F2C46D}a:hover{color:#FFD98F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1220; color: #EEF0F7; font-family: 'DM Sans', sans-serif; padding: 56px 20px 12px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
  <header style="display: flex; justify-content: space-between; align-items: flex-end">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700">Gökyüzüm</h1>
    <div role="tablist" aria-label="Dönem" style="display: flex; gap: 4px; background: #171C2E; border-radius: 10px; padding: 3px">
      <button role="tab" aria-selected="false" style="min-height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #9AA1B9; font: 500 13px 'DM Sans', sans-serif">Gün</button>
      <button role="tab" aria-selected="true" style="min-height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: #262C44; color: #EEF0F7; font: 700 13px 'DM Sans', sans-serif">Hafta</button>
      <button role="tab" aria-selected="false" style="min-height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #9AA1B9; font: 500 13px 'DM Sans', sans-serif">Tümü</button>
    </div>
  </header>

  <figure style="margin: 0; position: relative; height: 270px; border-radius: 22px; background: #080B16; border: 1px solid #262C44; overflow: hidden">
    <svg width="350" height="270" viewBox="0 0 350 270" aria-hidden="true" style="position: absolute; inset: 0">
      <g stroke="{{accent}}" stroke-opacity="0.5" stroke-width="1.2" fill="none">
        <polyline points="18,64 34,46 54,42 74,52 110,38 114,72 78,80 74,52"></polyline>
        <line x1="250" y1="40" x2="235" y2="96"></line>
        <line x1="195" y1="104" x2="215" y2="100"></line>
        <line x1="215" y1="100" x2="235" y2="96"></line>
        <line x1="195" y1="104" x2="175" y2="168"></line>
        <line x1="235" y1="96" x2="268" y2="160"></line>
        <line x1="40" y1="186" x2="66" y2="212"></line>
      </g>
      <g stroke="#4A5170" stroke-width="1.2" stroke-dasharray="3 4" fill="none">
        <line x1="160" y1="34" x2="195" y2="104"></line>
        <line x1="160" y1="34" x2="250" y2="40"></line>
        <polyline points="66,212 92,190 120,214 148,188"></polyline>
      </g>
      <g fill="{{accent}}">
        <circle cx="18" cy="64" r="3.5"></circle><circle cx="34" cy="46" r="4"></circle><circle cx="54" cy="42" r="4"></circle><circle cx="74" cy="52" r="3"></circle><circle cx="110" cy="38" r="5"></circle><circle cx="114" cy="72" r="4.5"></circle><circle cx="78" cy="80" r="4"></circle>
        <circle cx="250" cy="40" r="4.5"></circle><circle cx="195" cy="104" r="3.5"></circle><circle cx="215" cy="100" r="3.5"></circle><circle cx="235" cy="96" r="3.5"></circle><circle cx="268" cy="160" r="5.5"></circle><circle cx="175" cy="168" r="4.5"></circle>
        <circle cx="40" cy="186" r="4"></circle><circle cx="66" cy="212" r="4.5"></circle>
      </g>
      <g fill="none" stroke="#6E7590" stroke-dasharray="2 2">
        <circle cx="160" cy="34" r="5.5"></circle><circle cx="92" cy="190" r="4"></circle><circle cx="120" cy="214" r="4"></circle><circle cx="148" cy="188" r="4"></circle>
      </g>
      <g fill="#C9CEDD" font-size="11" font-family="DM Sans, sans-serif">
        <text x="20" y="104">Büyük Ayı · tamam</text>
        <text x="236" y="190">Avcı 6/7</text>
        <text x="96" y="244">Kassiopeia 2/5</text>
      </g>
      <g fill="#6E7590"><circle cx="320" cy="20" r="1"></circle><circle cx="330" cy="240" r="1"></circle><circle cx="300" cy="120" r="1"></circle></g>
    </svg>
    <figcaption style="position: absolute; right: 14px; top: 12px; font-size: 12px; color: #9AA1B9">Kesikli = henüz yanmadı</figcaption>
  </figure>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="background: #171C2E; border: 1px solid #262C44; border-radius: 16px; padding: 12px">
      <p style="margin: 0; font-size: 12px; color: #9AA1B9">Bu hafta</p>
      <p style="margin: 4px 0 0; font-size: 18px; font-weight: 700">9s 40dk</p>
    </div>
    <div style="background: #171C2E; border: 1px solid #262C44; border-radius: 16px; padding: 12px">
      <p style="margin: 0; font-size: 12px; color: #9AA1B9">Yıldız</p>
      <p style="margin: 4px 0 0; font-size: 18px; font-weight: 700">12</p>
    </div>
    <div style="background: #171C2E; border: 1px solid #262C44; border-radius: 16px; padding: 12px">
      <p style="margin: 0; font-size: 12px; color: #9AA1B9">Seri</p>
      <p style="margin: 4px 0 0; font-size: 18px; font-weight: 700">6 gün</p>
    </div>
  </div>

  <a href="Map.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 14px; border-radius: 16px; background: #171C2E; border: 1px solid #262C44; text-decoration: none; color: #EEF0F7">
    <span style="font-size: 15px; font-weight: 700">Takımyıldız koleksiyonu</span>
    <span style="font-size: 14px; color: {{accent}}">1 / 16 tamam ›</span>
  </a>

  <section aria-labelledby="bulut" style="display: flex; align-items: center; gap: 12px; background: #171C2E; border: 1px solid #262C44; border-radius: 16px; padding: 12px 14px">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8FB3FF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z"></path></svg>
    <div style="flex: 1">
      <h2 id="bulut" style="margin: 0; font-size: 15px; font-weight: 700">2 seri koruyucu bulut</h2>
      <p style="margin: 2px 0 0; font-size: 12px; color: #9AA1B9">Odaklanamadığın bir günü otomatik kapatır</p>
    </div>
  </section>

  <section aria-labelledby="roz" style="display: flex; flex-direction: column; gap: 10px">
    <h2 id="roz" style="margin: 0; font-size: 15px; font-weight: 700">Rozetler</h2>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; text-align: center">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span style="width: 52px; height: 52px; border-radius: 16px; background: #2A2616; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></span>
        <span style="font-size: 11px; color: #C9CEDD">İlk ışık</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span style="width: 52px; height: 52px; border-radius: 16px; background: #2A2616; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2M9 2h6"></path></svg></span>
        <span style="font-size: 11px; color: #C9CEDD">90 dk maraton</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span style="width: 52px; height: 52px; border-radius: 16px; background: #171C2E; border: 1px dashed #4A5170; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6E7590" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span>
        <span style="font-size: 11px; color: #9AA1B9">7 gün seri</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span style="width: 52px; height: 52px; border-radius: 16px; background: #171C2E; border: 1px dashed #4A5170; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6E7590" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span>
        <span style="font-size: 11px; color: #9AA1B9">Gece kuşu</span>
      </div>
    </div>
  </section>

  <nav aria-label="Ana menü" style="margin-top: auto; display: flex; justify-content: space-around; border-top: 1px solid #262C44; padding-top: 6px">
    <a href="Main.dc.html" style="min-width: 72px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9AA1B9; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2M9 2h6"></path></svg>Odak</a>
    <a href="Sky.dc.html" aria-current="page" style="min-width: 72px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>Gökyüzü</a>
    <a href="Rewards.dc.html" style="min-width: 72px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9AA1B9; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"></rect><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1 6 2 6-1-4-3-6 1"></path></svg>Ödüller</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2C46D","options":["#F2C46D","#8FB3FF","#7FD6B5"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F2C46D' };
  }
}
</script>
</body>
</html>
